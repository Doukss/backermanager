server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kermanager-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kermanager}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:passer0412}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:defaultSecretForDevOnly32Chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
